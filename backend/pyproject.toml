[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forkit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "extruct",
    "recipe-scrapers>=15",
    "bleach",
    "ingredient-parser-nlp",
    "Pillow>=11",
    "selectolax>=0.4.8,<1",
    "readability-lxml",
    "structlog",
    "slowapi",
    "anthropic",
    "apscheduler>=3.10,<4",
    "feedparser>=6.0",
    "defusedxml>=0.7",
]

[project.scripts]
forkit = "forkit.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "types-bleach",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
