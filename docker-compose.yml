services:
  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - FORKIT_DB_PATH=/data/forkit.db
      - FORKIT_IMAGE_DIR=/data/images
    volumes:
      - forkit-data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  forkit-data:
