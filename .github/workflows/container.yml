name: Publish lab image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend checks and browser tests
        run: |
          cd frontend
          npm ci
          npm run check
          npm run test:unit -- --run
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.imports.config.ts
      - name: Backend tests
        run: |
          python3 -m venv /tmp/forkit-tests
          /tmp/forkit-tests/bin/pip install uv==0.11.26
          /tmp/forkit-tests/bin/uv run --project backend --locked --extra dev pytest backend/tests -q
      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/dtbray/forkit:sha-$GITHUB_SHA"
          docker build --provenance=false --label "org.opencontainers.image.source=https://github.com/dtbray/forkit" --label "org.opencontainers.image.revision=$GITHUB_SHA" -f backend/Dockerfile -t "$image" .
          docker run -d --name forkit-smoke -p 127.0.0.1:8080:8000 "$image"
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then ready=1; break; fi
            sleep 2
          done
          docker logs forkit-smoke
          test "$ready" = 1
          curl -fsS http://127.0.0.1:8080/ >/dev/null
          curl -fsS http://127.0.0.1:8080/api/recipes >/dev/null
          docker exec forkit-smoke python3 -c "from forkit.parser.ingredients import structure_ingredient; r = structure_ingredient('2 cups flour'); assert r['qty'] == '2' and r['unit'] == 'cup' and r['item'] == 'flour', r"
          docker exec forkit-smoke python3 -c "from PIL import Image; import urllib.request; Image.new('RGB', (2, 2)).save('/data/images/mime-smoke.webp', 'WEBP'); r = urllib.request.urlopen('http://localhost:8000/data/images/mime-smoke.webp'); assert r.headers.get_content_type() == 'image/webp', r.headers"
          docker rm -f forkit-smoke
          docker push "$image"
